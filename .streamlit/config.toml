# Settings that are safe in BOTH environments — local and hosted.
#
# Deliberately absent: server.address, server.port, browser.serverAddress and
# browser.serverPort. Those pin where the server binds and, worse, tell the
# visitor's browser where to open its websocket. Hard-coding them to localhost
# means a hosted app instructs every visitor to connect to their own machine,
# so the page renders blank for everyone except someone already running it
# locally. The hosting platform must be left to assign these itself.
#
# Local privacy (binding to loopback so nothing is reachable from the network)
# is enforced by the launcher instead — see "Launch DCF Model.cmd", which
# passes --server.address=127.0.0.1 on the command line. That keeps the local
# run private without following the app into deployment.

[browser]
# Never send usage statistics.
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2a78d6"

[client]
showErrorDetails = true
toolbarMode = "minimal"
